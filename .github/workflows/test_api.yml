name: Test API made using FastAPI

on: [push, pull_request]

env:
  ALGORITHM: HS256
  SECRET_KEY: supersecretkey
  baseUrl: http://127.0.0.1:8000
  DB_URL: sqlite:///db_url
  ALEMBIC_DB_URL: sqlite:///db_url

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install requests packaging python-dotenv argon2-cffi

    - name: Install Testing Dependencies
      run: pip install ruff pytest pytest-cov

    - name: Lint with Ruff
      run: |
        # Fails build if there are syntax errors or unresolved imports/issues
        ruff check . --output-format=github

    - name: Format Check with Ruff
      run: |
        # Fails build if Python files are not styled according to formatting standards
        ruff format . --check

    - name: Run unit tests
      run: python -m unittest discover -v -s test

    # - name: Run Tests & Check for Skipped Tests
    #   run: |
    #     # Run tests and output reports
    #     pytest --cov=. --junitxml=pytest-report.xml

    #     # CRITICAL: Fail if tests were skipped/bypassed.
    #     # Helps detect AI-generated code that skipped its homework.
    #     if grep -q -E 'skipped="[1-9]' pytest-report.xml; then
    #       echo "❌ ERROR: One or more Python tests were skipped!"
    #       grep -E -o 'skipped="[0-9]+"' pytest-report.xml
    #       exit 1
    #     fi

    - name: Run FastAPI app and tests
      run: |
        # Start FastAPI app in background
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        SERVER_PID=$!

        # Wait until /api/ping responds with status 200 (max 10 tries)
        for i in {1..10}; do
          echo "Waiting for server... attempt $i"
          if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/ping | grep -q 200; then
            echo "Server is up!"
            break
          fi
          sleep 1
        done

        # Run tests
        python test/test_unittest.py

        # Kill the server
        kill $SERVER_PID
